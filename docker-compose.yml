services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibelab-api
    restart: always
    expose:
      - "8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: vibelab-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
